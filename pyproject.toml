[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-orchestrator"
version = "0.6.0"
description = "Orquestador jerarquico de investigacion y analisis construido con LangGraph."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Diego Chiang Melendez" }]
dependencies = [
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.2,<2",
  "pinecone>=10.0,<11",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "truststore>=0.10,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
multi-agent = "multi_agent_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/multi_agent_orchestrator"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
